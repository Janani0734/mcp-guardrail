name: Automated Audit Chain Anchoring

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  anchor-chain:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Cryptographic External Anchoring
        run: |
          echo Initiating background anchor connection to Render server...
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST https://onrender.com \
            -H "Authorization: Bearer ${{ secrets.M_ADMIN_API_KEY }}" \
            -H "Content-Type: application/json")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo Server Response Body: $BODY
          echo Server HTTP Status: $HTTP_STATUS

          if [ $HTTP_STATUS -ne 200 ]; then
            echo Error: Anchoring failed with status $HTTP_STATUS
            exit 1
          fi

          echo Successfully anchored checkpoint snapshot to Cloudflare R2 Bucket!
