<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Guardrail Suite Pro Console</title>
    <style>
        :root { --bg-main: #0b0f19; --card-bg: #151d30; --text-primary: #f4f6f8; --text-muted: #8792a2; --primary-glow: #635bff; --accent-danger: #df1b41; --accent-success: #00d4b6; --accent-warn: #ffb600; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-main); color: var(--text-primary); padding: 40px; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #222e4a; padding-bottom: 25px; margin-bottom: 35px; }
        h1 { margin: 0; font-size: 26px; color: #ffffff; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
        .badge { background: linear-gradient(135deg, #635bff 0%, #877eff 100%); color: white; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; box-shadow: 0 0 15px rgba(99,91,255,0.4); }
        .card { background: var(--card-bg); border-radius: 12px; border: 1px solid #222e4a; padding: 35px; margin-bottom: 30px; position: relative; overflow: hidden; transition: all 0.3s ease; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: var(--accent-warn); }
        .card.status-rolled_back::before { background: var(--accent-danger); }
        .card.status-committed::before { background: var(--accent-success); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .tx-title { font-size: 22px; font-weight: bold; color: #ffffff; }
        .tx-target { font-size: 14px; color: var(--text-muted); margin-top: 6px; }
        .tx-id-badge { font-family: monospace; font-weight: bold; color: var(--primary-glow); background: #1e2942; padding: 4px 10px; border-radius: 6px; border: 1px solid #2c3a58; font-size: 14px; }
        .payload-container { background: #0b0f19; border: 1px solid #222e4a; padding: 16px; border-radius: 6px; font-family: monospace; font-size: 13px; margin: 20px 0; color: #ff7b72; overflow-x: auto; }
        .metrics-banner { background: rgba(255, 182, 0, 0.1); border: 1px solid rgba(255, 182, 0, 0.2); color: var(--accent-warn); padding: 14px 20px; border-radius: 6px; font-size: 14px; margin-bottom: 20px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .card.status-rolled_back .metrics-banner { background: rgba(223, 27, 65, 0.1); border: 1px solid rgba(223, 27, 65, 0.2); color: var(--accent-danger); }
        .card.status-committed .metrics-banner { background: rgba(0, 212, 182, 0.1); border: 1px solid rgba(0, 212, 182, 0.2); color: var(--accent-success); }
        .action-tray { display: flex; gap: 15px; margin-top: 25px; }
        button { border: none; padding: 14px 28px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: all 0.2s ease; }
        .btn-override-abort { background: var(--accent-danger); color: white; box-shadow: 0 4px 12px rgba(223,27,65,0.2); }
        .btn-override-abort:hover { background: #c51435; transform: translateY(-1px); }
        .btn-override-approve { background: var(--accent-success); color: #0b0f19; box-shadow: 0 4px 12px rgba(0,212,182,0.2); }
        .btn-override-approve:hover { background: #00bfa4; transform: translateY(-1px); }
        .signature-ledger { font-family: monospace; font-size: 12px; color: var(--text-muted); margin-top: 20px; background: #0b0f19; padding: 12px 16px; border-radius: 6px; border: 1px solid #1e2942; display: flex; flex-direction: column; gap: 4px; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 60px 20px; border: 2px dashed #222e4a; border-radius: 12px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ MCP Guardrail Enterprise Engine Console</h1>
            <span class="badge" id="runtime-status">System Operational</span>
        </div>
        <div id="telemetry-stream-root">
            <div class="empty-state">Synchronizing with Hardened API Gateway Core...</div>
        </div>
    </div>

    <script>
        const localApiEndpoint = "https://onrender.com";
        const overrideApiEndpoint = "https://onrender.com";
        
        let countdownTimerReference = null;
        let globalCountdownSeconds = 30;
        let isUsingFallback = false;

        const fallbackData = [{
            id: "tx_secure_uuid_71edb2d",
            operation: "WIPE_LOGS",
            target: "user_database_logs",
            canary: "SCHEMA_VALIDATED",
            signature: "ff474320d4185724c3f3dc027c31d72cf128ec0f2e81785173e6ead801388b86",
            status: "PENDING",
            expiresAt: new Date(Date.now() + 30000).toISOString()
        }];

        async function fetchSystemTelemetryLogs() {
            try {
                // Strict 3-second network cutoff before showing instant fallback preview layout
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);
                
                const res = await fetch(localApiEndpoint, { signal: controller.signal });
                clearTimeout(timeoutId);
                const transactions = await res.json();
                isUsingFallback = false;
                document.getElementById('runtime-status').innerText = "Cloud Active";
                renderDashboardCards(transactions);
            } catch (err) {
                console.log("📡 Cloud container warming up. Launching smart fallback dashboard view.");
                isUsingFallback = true;
                document.getElementById('runtime-status').innerText = "Sandbox Mode (Syncing Backend)";
                renderDashboardCards(fallbackData);
            }
        }

        function renderDashboardCards(transactions) {
            const rootElement = document.getElementById('telemetry-stream-root');
            let htmlBuffer = "";

            transactions.forEach(tx => {
                let bannerLayout = "";
                let customActionButtons = "";

                if (tx.status === "PENDING") {
                    bannerLayout = `<div class="metrics-banner" id="countdown-banner-container">
                        <span>⚠️ High-Risk Intention Intercepted: Server-Side Enforcement Point Active</span>
                        <span id="countdown-clock-digits" style="font-weight:bold; font-variant-numeric: tabular-nums;">${globalCountdownSeconds}s remaining</span>
                    </div>`;
                    customActionButtons = `<div class="action-tray" id="action-buttons-tray">
                        <button class="btn-override-approve" onclick="handleAction('${tx.id}', 'APPROVE')">Explicit Admin Approve</button>
                        <button class="btn-override-abort" onclick="handleAction('${tx.id}', 'ABORT')">Administrative Abort</button>
                    </div>`;
                } else if (tx.status === "COMMITTED") {
                    bannerLayout = `<div class="metrics-banner">✅ TRANSACTION ENFORCED: Parameterized database modification completed under least privilege.</div>`;
                } else if (tx.status === "ROLLED_BACK") {
                    bannerLayout = `<div class="metrics-banner">🛡️ DATA PROTECTION ENGAGED: Interception complete. Attack vector terminated.</div>`;
                }

                htmlBuffer += `
                    <div class="card status-${tx.status.toLowerCase()}" id="main-tx-card">
                        <div class="card-header">
                            <div>
                                <div class="tx-title">Structural Query Mutation Intercepted: ${tx.operation}</div>
                                <div class="tx-target">Enforcement Target Node: <strong>${tx.target}</strong></div>
                            </div>
                            <span class="tx-id-badge" style="font-size: 11px;">${tx.id}</span>
                        </div>
                        <div class="payload-container">
                            <strong>Strict JSON Schema Allowlist Validation Profile:</strong>
                            <pre style="margin: 8px 0 0 0;">{\n  "operation": "${tx.operation}",\n  "target": "${tx.target}",\n  "validation": "${tx.canary}"\n}</pre>
                        </div>
                        ${bannerLayout}
                        ${customActionButtons}
                        <div class="signature-ledger">
                            <strong>Non-Repudiation Security Audit Matrix Ledger Checksums:</strong>
                            <span>Hash-Chained Block Signature (SHA-256): <span style="color: var(--accent-success); font-size:11px; word-break: break-all;">${tx.signature}</span></span>
                        </div>
                    </div>
                `;
            });

            rootElement.innerHTML = htmlBuffer;

            if (transactions.some(t => t.status === "PENDING") && !countdownTimerReference) {
                startStagingCountdown();
            }
        }

        function startStagingCountdown() {
            countdownTimerReference = setInterval(() => {
                globalCountdownSeconds--;
                const digitsBox = document.getElementById('countdown-clock-digits');
                if (digitsBox) {
                    digitsBox.innerText = `${globalCountdownSeconds}s remaining`;
                }
                if (globalCountdownSeconds <= 0) {
                    clearInterval(countdownTimerReference);
                    countdownTimerReference = null;
Use code with caution.
executeUIVisualState('COMMITTED');
}
}, 1000);
}
async function handleAction(txId, actionType) {
clearInterval(countdownTimerReference);
countdownTimerReference = null;
executeUIVisualState(actionType === 'ABORT' ? 'ROLLED_BACK' : 'COMMITTED');
if (!isUsingFallback) {
try {
await fetch(overrideApiEndpoint, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ txId: txId, action: actionType })
});
} catch (e) {
console.log("Network outbox delivery skipped.");
}
}
}
function executeUIVisualState(status) {
const mainCard = document.getElementById('main-tx-card');
const bannerContainer = document.getElementById('countdown-banner-container');
const buttonsTray = document.getElementById('action-buttons-tray');
if(mainCard) mainCard.className = card status-${status.toLowerCase()};
if(bannerContainer) {
bannerContainer.className = "metrics-banner";
bannerContainer.innerHTML = status === 'ROLLED_BACK'
? <span>🛡️ DATA PROTECTION ENGAGED: Interception complete. Attack vector terminated.</span>
: <span>✅ TRANSACTION ENFORCED: Parameterized database modification completed under least privilege.</span>;
}
if(buttonsTray) buttonsTray.style.display = "none";
}
fetchSystemTelemetryLogs();
// Keep checking in the background to swap dynamically to the real live backend once awake
setInterval(fetchSystemTelemetryLogs, 6000);
