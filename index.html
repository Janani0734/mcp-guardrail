<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Guardrail Proxy Firewall</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --bg-main: #0b0f19; --card-bg: #151d30; --text-primary: #f4f6f8; --text-muted: #8792a2; --primary-glow: #635bff; --accent-danger: #df1b41; --accent-success: #00d4b6; --accent-warn: #ffb600; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-main); color: var(--text-primary); padding: 40px; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #222e4a; padding-bottom: 25px; margin-bottom: 35px; }
        h1 { margin: 0; font-size: 26px; color: #ffffff; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
        .badge { background: #1e2942; border: 1px solid #2c3a58; color: var(--text-muted); padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .card { background: var(--card-bg); border-radius: 12px; border: 1px solid #222e4a; padding: 35px; margin-bottom: 30px; position: relative; overflow: hidden; transition: all 0.3s ease; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: var(--accent-warn); }
        .card.status-rolled_back::before { background: var(--accent-danger); }
        .card.status-committed::before { background: var(--accent-success); }
        .card.status-expired::before { background: var(--text-muted); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .tx-title { font-size: 22px; font-weight: bold; color: #ffffff; }
        .tx-target { font-size: 14px; color: var(--text-muted); margin-top: 8px; line-height: 1.5; }
        .tx-id-badge { font-family: monospace; font-weight: bold; color: var(--primary-glow); background: #0b0f19; padding: 4px 12px; border-radius: 6px; border: 1px solid #1e2942; font-size: 13px; }
        .payload-container { background: #0b0f19; border: 1px solid #222e4a; padding: 18px; border-radius: 6px; font-family: monospace; font-size: 13px; margin: 20px 0; color: #ff7b72; overflow-x: auto; line-height: 1.6; }
        .metrics-banner { padding: 14px 20px; border-radius: 6px; font-size: 14px; margin-bottom: 20px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .banner-pending { background: rgba(255, 182, 0, 0.1); border: 1px solid rgba(255, 182, 0, 0.2); color: var(--accent-warn); }
        .banner-committed { background: rgba(0, 212, 182, 0.1); border: 1px solid rgba(0, 212, 182, 0.2); color: var(--accent-success); }
        .banner-rolled_back { background: rgba(223, 27, 65, 0.1); border: 1px solid rgba(223, 27, 65, 0.2); color: var(--accent-danger); }
        .banner-expired { background: rgba(135, 146, 162, 0.1); border: 1px solid rgba(135, 146, 162, 0.2); color: var(--text-muted); }
        .action-tray { display: flex; gap: 15px; margin-top: 25px; }
        button { border: none; padding: 14px 28px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: all 0.2s ease; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-override-abort { background: var(--accent-danger); color: white; box-shadow: 0 4px 12px rgba(223,27,65,0.2); }
        .btn-override-abort:hover { background: #c51435; transform: translateY(-1px); }
        .btn-override-approve { background: var(--accent-success); color: #0b0f19; box-shadow: 0 4px 12px rgba(0,212,182,0.2); }
        .btn-override-approve:hover { background: #00bfa4; transform: translateY(-1px); }
        .signature-ledger { font-family: monospace; font-size: 13px; color: var(--text-muted); margin-top: 25px; background: #0b0f19; padding: 16px; border-radius: 6px; border: 1px solid #1e2942; display: flex; flex-direction: column; gap: 6px; line-height: 1.5; }
        .auth-view { max-width: 400px; margin: 100px auto; background: var(--card-bg); border: 1px solid #222e4a; padding: 40px; border-radius: 12px; text-align: center; }
        .auth-input { width: 100%; padding: 12px; margin: 10px 0 20px 0; background: #0b0f19; border: 1px solid #222e4a; color: white; border-radius: 6px; box-sizing: border-box; }
        .btn-primary { background: var(--primary-glow); color: white; width: 100%; padding: 14px; margin-bottom: 15px; }
        .btn-secondary { background: transparent; border: 1px solid #222e4a; color: var(--text-muted); width: 100%; padding: 14px; }
        .error-toast { background: rgba(223, 27, 65, 0.15); border: 1px solid var(--accent-danger); color: #ffffff; padding: 12px 20px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; display: none; text-align: left; }
    </style>
</head>
<body>
    <div id="app-root">
        <!-- Gateway Choice Landing Frame Layout -->
        <div class="auth-view" id="auth-gate-box">
            <h2>🛡️ MCP-Guardrail Gateway</h2>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 30px;">Continuous Verification Security Middleware Console</p>
            <div id="error-toast-surface" class="error-toast"></div>
            <button class="btn-primary" onclick="launchWorkspaceMode('sandbox')">Try Public Sandbox Demo</button>
            <button class="btn-secondary" onclick="toggleAuthFormDisplay(true)">Admin Login Console</button>
        </div>

        <!-- Secure Credentials Submission Frame Form Layout -->
        <div class="auth-view" id="auth-form-box" style="display: none;">
            <h3>Admin Authentication</h3>
            <label style="text-align: left; display: block; font-size: 13px; color: var(--text-muted);">Email Address</label>
            <input type="email" id="auth-email-field" class="auth-input" placeholder="admin@enterprise.com">
            
            <label style="text-align: left; display: block; font-size: 13px; color: var(--text-muted);">Account Security Password</label>
            <input type="password" id="auth-pass-field" class="auth-input" placeholder="••••••••">
            
            <button class="btn-primary" id="btn-login-trigger" onclick="executeSupabaseAuthLogin()">Verify and Session Authenticate</button>
            <button class="btn-secondary" onclick="toggleAuthFormDisplay(false)">← Return to Gateway</button>
        </div>
    </div>

    <!-- Live Execution Telemetry Console Dashboard Workspace Layout Content -->
    <template id="dashboard-console-blueprint">
        <div class="container">
            <div class="header">
                <h1>🛡️ MCP Guardrail Proxy Firewall</h1>
                <span class="badge" id="runtime-status">Synchronizing Context...</span>
            </div>
            <div id="telemetry-stream-root"></div>
        </div>
    </template>

    <script>
        const API_BASE = "https://onrender.com";
        const SUPABASE_PROJECT_URL = "https://supabase.co";
        const SUPABASE_PUBLIC_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ3cXJhZGpqcXZ6bnZkd3JhbHJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE4ODQ0MDAsImV4cCI6MjA3NzQ2MDQwMH0.your-signature-hash";

        let supabaseClientInstance = null;
        let localCountdownTimer = null;
        let activeRuntimeWorkspaceMode = 'sandbox';

        if (typeof supabase !== 'undefined') {
            supabaseClientInstance = supabase.createClient(SUPABASE_PROJECT_URL, SUPABASE_PUBLIC_ANON_KEY);
        }

        function toggleAuthFormDisplay(showForm) {
            document.getElementById("auth-gate-box").style.display = showForm ? "none" : "block";
            document.getElementById("auth-form-box").style.display = showForm ? "block" : "none";
        }

        function launchWorkspaceMode(targetMode) {
            activeRuntimeWorkspaceMode = targetMode;
            const template = document.getElementById("dashboard-console-blueprint");
            const root = document.getElementById("app-root");
            root.innerHTML = "";
            root.appendChild(template.content.cloneNode(true));
            
            fetchSystemTelemetryLogs();
            setInterval(fetchSystemTelemetryLogs, 4000);
        }

        async function executeSupabaseAuthLogin() {
            const emailInput = document.getElementById("auth-email-field").value;
            const passwordInput = document.getElementById("auth-pass-field").value;
            const loginBtn = document.getElementById("btn-login-trigger");

            if (!supabaseClientInstance) {
                alert("Supabase config tracking missed.");
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = "Verifying Signatures...";

            const { data, error } = await supabaseClientInstance.auth.signInWithPassword({
                email: emailInput,
                password: passwordInput
            });

            if (error) {
                alert(`🚨 Auth Error: ${error.message}`);
                loginBtn.disabled = false;
                loginBtn.textContent = "Verify and Session Authenticate";
                return;
            }

            if (data.session) {
                sessionStorage.setItem("sb_auth_jwt_token_string", data.session.access_token);
                launchWorkspaceMode('production');
            }
        }

        async function fetchSystemTelemetryLogs() {
            try {
                const token = sessionStorage.getItem("sb_auth_jwt_token_string");
                const queryPath = `${API_BASE}/api/ledger?mode=${activeRuntimeWorkspaceMode}`;
                
Use code with caution.
const headers = { 'Content-Type': 'application/json' };
if (activeRuntimeWorkspaceMode === 'production' && token) {
headers['Authorization'] = Bearer ${token};
}
const res = await fetch(queryPath, { headers });
const transactions = await res.json();
const statusBadge = document.getElementById('runtime-status');
if (statusBadge) {
statusBadge.textContent = activeRuntimeWorkspaceMode === 'sandbox'
? "Demo Environment (Disposable Test Data)"
: "Role: verified_guardrail_admin";
}
renderSecureDOM(transactions);
} catch (err) {
console.log("Sync error encountered.");
}
}
function renderSecureDOM(transactions) {
const rootElement = document.getElementById('telemetry-stream-root');
if(!rootElement) return;
rootElement.innerHTML = "";
if (!Array.isArray(transactions) || transactions.length === 0) {
const empty = document.createElement("div");
empty.className = "empty-state";
empty.textContent = "No active tool calls require human confirmation inside this environment domain.";
rootElement.appendChild(empty);
return;
}
transactions.forEach(tx => {
const card = document.createElement("div");
card.className = card status-${tx.status.toLowerCase()};
const cardHeader = document.createElement("div");
cardHeader.className = "card-header";
const titleContainer = document.createElement("div");
const txTitle = document.createElement("div");
txTitle.className = "tx-title";
txTitle.textContent = "Pending Destructive Operation";
const txTarget = document.createElement("div");
txTarget.className = "tx-target";
txTarget.innerHTML = Operation Signature: <strong id="op-sig-node"></strong><br> Target Resource Node: <strong id="target-res-node"></strong><br> Requested By: <span style="font-family: monospace; color: var(--primary-glow);">mcp_client_agent</span><br> Affected Scope: <span style="color: var(--accent-danger);">All target logging blocks matching direct mutation parameters</span>;
titleContainer.appendChild(txTitle);
titleContainer.appendChild(txTarget);
const txIdBadge = document.createElement("span");
txIdBadge.className = "tx-id-badge";
txIdBadge.textContent = Event ID: ${tx.id.substring(0, 15)}...;
cardHeader.appendChild(titleContainer);
cardHeader.appendChild(txIdBadge);
card.appendChild(cardHeader);
txTarget.querySelector('#op-sig-node').textContent = tx.operation;
txTarget.querySelector('#target-res-node').textContent = tx.target;
const payloadContainer = document.createElement("div");
payloadContainer.className = "payload-container";
const strongLabel = document.createElement("strong");
strongLabel.textContent = "Intercepted Tool Arguments Content Object:";
const preNode = document.createElement("pre");
preNode.style.margin = "8px 0 0 0";
preNode.textContent = JSON.stringify({ operation: tx.operation, target: tx.target, policy_gate: tx.canary }, null, 2);
payloadContainer.appendChild(strongLabel);
payloadContainer.appendChild(preNode);
card.appendChild(payloadContainer);
const banner = document.createElement("div");
banner.className = metrics-banner banner-${tx.status.toLowerCase()};
if (tx.status === "PENDING") {
const expiresAt = new Date(tx.expiresAt);
const updateClock = () => {
const remaining = Math.max(0, Math.round((expiresAt - new Date()) / 1000));
banner.textContent = activeRuntimeWorkspaceMode === 'sandbox'
? ⏳ Demo environment. Actions affect disposable test data only. Expires in ${remaining}s.
: ⏳ Approval expires in ${remaining}s. No action will execute automatically at zero.;
if (remaining <= 0) {
clearInterval(localCountdownTimer);
fetchSystemTelemetryLogs();
}
};
clearInterval(localCountdownTimer);
localCountdownTimer = setInterval(updateClock, 1000);
updateClock();
card.appendChild(banner);
const actionTray = document.createElement("div");
actionTray.className = "action-tray";
const approveBtn = document.createElement("button");
approveBtn.className = "btn-override-approve";
approveBtn.textContent = "Review and Approve";
approveBtn.onclick = () => handleAction(tx.id, "APPROVE", approveBtn, abortBtn);
const abortBtn = document.createElement("button");
abortBtn.className = "btn-override-abort";
abortBtn.textContent = "Reject Operation";
abortBtn.onclick = () => handleAction(tx.id, "ABORT", approveBtn, abortBtn);
actionTray.appendChild(approveBtn);
actionTray.appendChild(abortBtn);
card.appendChild(actionTray);
} else {
if (tx.status === "COMMITTED") {
banner.textContent = "✅ Verified: Operation released and completed via parameter-bounded cloud RPC execution.";
} else if (tx.status === "ROLLED_BACK") {
banner.textContent = "🛡️ Rejected: Operation explicitly terminated by user intervention.";
} else {
banner.textContent = "🚨 Stale: Staging validation window expired. Request safely locked out.";
}
card.appendChild(banner);
}
const signatureLedger = document.createElement("div");
signatureLedger.className = "signature-ledger";
const auditLabel = document.createElement("strong");
auditLabel.textContent = "Audit Integrity Validation";
const hashSpan = document.createElement("span");
hashSpan.style.fontSize = "13px";
hashSpan.style.wordBreak = "break-all";
hashSpan.textContent = Event Hash (HMAC-SHA256): ${tx.signature};
signatureLedger.appendChild(auditLabel);
signatureLedger.appendChild(hashSpan);
card.appendChild(signatureLedger);
rootElement.appendChild(card);
});
}
async function handleAction(txId, actionType, approveBtn, abortBtn) {
approveBtn.disabled = true;
abortBtn.disabled = true;
try {
const token = sessionStorage.getItem("sb_auth_jwt_token_string");
const headers = { 'Content-Type': 'application/json' };
if (activeRuntimeWorkspaceMode === 'production' && token) {
headers['Authorization'] = Bearer ${token};
}
const res = await fetch(${API_BASE}/api/override, {
method: 'POST',
headers: headers,
body: JSON.stringify({ txId: txId, action: actionType, mode: activeRuntimeWorkspaceMode })
});
if (res.ok) fetchSystemTelemetryLogs();
} catch (err) {
console.log("Action frame execution failure.");
}
}
